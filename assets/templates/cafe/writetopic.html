<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <title>Cafe.WriteTopic</title>
  <style>
    .content {
      padding-left: 0;
    }

    .backlink {
      padding-left: 4px;
    }

    .post-container {
      width: fit-content;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    .content-section {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
    }

    .content-textarea {
      width: 300px;
      height: 200px;
      resize: none;
      padding-right: 12px;
    }

    .topic-title-textarea {
      field-sizing: content;
      width: 300px;
      resize: none;
      padding-right: 12px;
    }

    .post-submit {
      width: fit-content;
      margin-top: 24px;
    }

    .post-status {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="space-y-xs"></div>
            <a class="link backlink" th:text="'← Back to ' + ${#strings.capitalize(data.sectionName)}"></a>
            <form id="post-form" class="post-container">
              <p>Write a topic</p>
              <textarea id="topic-title-textarea" class="topic-title-textarea" placeholder="Title"
                maxlength="80"></textarea>
              <div class="content-section">
                <label for="content-textarea">Content</label>
                <textarea id="content-textarea" class="content-textarea"
                  placeholder="Write your topic here..."></textarea>
              </div>
              <button type="submit" class="post-submit">Post</button>
              <p id="post-status" class="post-status"></p>
            </form>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    let isTitleValid = false;
    let isContentValid = false;

    $(document).ready(function () {
      $("#post-form").submit(function (event) {
        postFormSubmitListener(event)
      })

      $(".backlink").attr('href', new URL('.', window.location.href).href.replace(/\/$/, ''))
    })

    function checkForm() {
      validateTitle()
      validateContent()
      return isTitleValid && isContentValid
    }

    function validateTitle() {
      const titleText = $("#topic-title-textarea").val();
      if (titleText.length < 8) {
        isTitleValid = true;
        $("#post-status").text("Title must be at least 8 characters.")
      } else {
        isTitleValid = true;
      }
    }

    function validateContent() {
      const contentText = $("#content-textarea").val();
      if (contentText.length < 20) {
        isContentValid = false;
        $("#post-status").text("Content should contains at least 20 characters.")
      } else {
        isContentValid = true;
      }
    }

    async function postFormSubmitListener(event) {
      event.preventDefault()
      if (!checkForm()) return

      const titleText = $("#topic-title-textarea").val();
      const contentText = $("#content-textarea").val();
      const payload = { title: titleText, content: contentText }
      console.log(JSON.stringify(payload))

      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          window.location.href = new URL('.', window.location.href).href.replace(/\/$/, '')
          return
        } else if (response.status == 400) {
          $("#post-status").text(await response.text())
        }
      } catch (err) {
        console.error("Post form error: ", err)
      }
    }
  </script>
</body>

</html>

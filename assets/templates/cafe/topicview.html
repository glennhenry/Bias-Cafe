<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Cafe.TopicView</title>
  <style>
    textarea {
      all: unset;
    }

    .content {
      padding-left: 0;
    }

    .backlink {
      padding: 4px;
    }

    .post-header {
      display: flex;
      flex-direction: column;
    }

    .post-title {
      font-size: 16px;
      padding: 8px;
      border-top: 1px solid #ccc;
    }

    .post {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .post:last-child {
      border-bottom: 1px solid #ccc;
    }

    .author-profile {
      width: 150px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }

    .avatar-container {
      padding: 24px;
      padding-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .avatar {
      border: 1px solid #ccc;
    }

    .author-info-container {
      font-size: 12px;
      padding-bottom: 24px;
    }

    .author-name {
      text-align: center;
      font-weight: bold;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      overflow-wrap: anywhere;
      word-break: normal;
      overflow: hidden;
    }

    .post-layout {
      flex: 1;
    }

    .post-content-container:hover .post-context-actions {
      opacity: 1;
    }

    .post-content {
      min-height: 120px;
      padding: 8px;
    }

    .post-footer {
      display: flex;
      flex-direction: row;
      align-items: end;
      padding: 8px;
      margin-top: 32px;
    }

    .post-context-actions {
      display: flex;
      flex: 1;
      gap: 4px;
      opacity: 0;
    }

    .post-info {
      text-align: end;
    }

    .comment-info-row {
      display: flex;
      justify-content: end;
      gap: 4px;
    }

    .comment-layout {
      display: flex;
      flex-direction: column;
      background: var(--site-bg-color);
      border-top: 1px solid #ccc;
    }

    .comment {
      display: flex;
      flex-direction: row;
      gap: 4px;
      padding: 12px;
      padding-left: 16px;
      border-bottom: 1px solid #ccc;
    }

    .comment:hover .comment-context-actions {
      opacity: 1;
    }

    .comment-author-avatar {
      height: max-content;
      padding: 1px;
      border: 1px solid #b3b3b3;
    }

    .comment-author-name-container {
      width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comment-author-name {
      font-weight: bold;
      color: #975396;
      font-size: 12px;
    }

    .comment-posted-date {
      font-size: 12px;
      color: #6c6c6c;
    }

    .comment-content-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-content {
      flex: 1;
    }

    .comment-context-actions {
      display: flex;
      flex-direction: row;
      justify-content: end;
      gap: 4px;
      opacity: 0;
    }

    .comment-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 8px;
      padding: 16px;
    }

    .comment-textarea {
      height: 50px;
      border: 1px solid #ccc;
      padding: 4px;
      padding-right: 16px;
      overflow-wrap: break-word;
      overflow-y: auto;
      resize: none;
      cursor: text;
    }

    .comment-publish-btn {
      align-self: end;
    }

    #comment-status {
      color: red;
      align-self: end;
    }

    .topic-reply-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
    }

    .topic-reply-box {
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .topic-reply-textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 200px;
      max-height: 400px;
      padding-right: 12px;
      overflow-y: hidden;
      resize: none;
      cursor: text;
    }

    .topic-reply-publish-btn {
      width: fit-content;
      align-self: end;
    }

    #topic-reply-status {
      color: red;
      align-self: end;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="post-header">
              <a class="link backlink" th:text="'← Back to ' + ${#strings.capitalize(data.sectionName)}"></a>
              <h1 class="post-title" th:text="${data.topic.title}"></h1>
            </div>
            <div class="posts-list">

              <!-- Main topic -->
              <div class="post">
                <div class="author-profile">
                  <div class="avatar-container">
                    <img class="avatar" style="padding: 4px;" th:src="'/' + ${data.topic.authorAvatarUrl}"
                      alt="profile avatar" width="100">
                  </div>
                  <div class="author-info-container">
                    <p class="author-name" th:text="${data.topic.authorDisplayName}"></p>
                  </div>
                </div>
                <div class="post-layout">
                  <div class="post-content-container">
                    <p class="post-content" th:text="${data.topic.content}"></p>
                    <div class="post-footer">
                      <div class="post-context-actions">
                        <a href="javascript:void(0);" title="Report this post">
                          <img src="/icons/danger.png" alt="Danger sign" width="24px">
                        </a>
                        <a href="javascript:void(0);" title="Share">
                          <img src="/icons/share.png" alt="Blue arrow pointing right" width="24px">
                        </a>
                      </div>
                      <div class="post-info">
                        <span class="js-format-date" th:data-raw-date="${data.topic.postedDate}">
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Replies -->
              <div class="post" th:each="reply: ${data.replies}">
                <div class="author-profile">
                  <div class="avatar-container">
                    <img class="avatar" style="padding: 4px;" th:src="'/' + ${reply.authorAvatarUrl}"
                      alt="profile avatar" width="100">
                  </div>
                  <div class="author-info-container">
                    <p class="author-name" th:text="${reply.authorDisplayName}"></p>
                  </div>
                </div>
                <div class="post-layout">
                  <div class="post-content-container">
                    <p class="post-content" th:text="${reply.content}"></p>
                    <div class="post-footer">
                      <div class="post-context-actions">
                        <a href="javascript:void(0);" title="Report this post">
                          <img src="/icons/danger.png" alt="Danger sign" width="24px">
                        </a>
                        <a href="javascript:void(0);" title="Share">
                          <img src="/icons/share.png" alt="Blue arrow pointing right" width="24px">
                        </a>
                      </div>
                      <div class="post-info">
                        <div class="comment-info-row">
                          <a class="link see-comment" href="javascript:void(0)"
                            th:text="${#lists.isEmpty(reply.comments) ? 'See comments' : 'Collapse'}"
                            th:data-comment-id="${reply.replyId}"></a>
                          <p th:text="'(' + ${#lists.size(reply.comments)} + ')'"></p>
                          <a class="comment-icon" href="javascript:void(0)" title="Add a comment"
                            th:data-comment-textarea-id="${reply.replyId}">
                            <img src="/icons/chat.png" alt="Chat bubble" width="24">
                          </a>
                        </div>
                        <span class="js-format-date" th:data-raw-date="${reply.postedDate}"></span>
                      </div>
                    </div>
                  </div>

                  <!-- Comments -->
                  <div class="comment-layout" th:classappend="${#lists.isEmpty(reply.comments)} ? 'hidden'"
                    th:data-comment-id="${reply.replyId}">
                    <div class="comment" th:each="comment: ${reply.comments}">
                      <img class="comment-author-avatar" th:src="'/' + ${comment.authorAvatarUrl}" width="40px">
                      <div class="comment-author-name-container">
                        <a class="comment-author-name" href="javascript:void(0)"
                          th:text="${comment.authorDisplayName}"></a>
                        <p class="js-format-date comment-posted-date" th:data-raw-date="${comment.postedDate}"></p>
                      </div>
                      <div class="comment-content-container">
                        <p class="comment-content" th:text="${comment.content}"></p>
                        <div class="comment-context-actions">
                          <a href="javascript:void(0)" title="Report this comment">
                            <img src="/icons/danger.png" alt="Danger sign" width="20px">
                          </a>
                        </div>
                      </div>
                    </div>

                    <!-- Reply to a child reply -->
                    <div class="comment-form">
                      <textarea class="comment-textarea" placeholder="Write a reply..."
                        th:data-comment-textarea-id="${reply.replyId}"></textarea>
                      <button class="comment-publish-btn" th:data-comment-id="${reply.replyId}">Publish</button>
                      <p id="comment-status" th:data-comment-id="${reply.replyId}"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Reply to the topic -->
            <div class="topic-reply-section">
              <div class="topic-reply-box">
                <textarea id="topic-reply-textarea" class="topic-reply-textarea" placeholder="Write your reply here..."
                  th:if="${data.account != null}"></textarea>
                <p th:if="${data.account == null}">You need to <a id="register" class="link"
                    href="/register">register</a>
                  or <a id="login" class="link" href="/login">login</a> before posting a
                  reply.</p>
              </div>
              <button id="topic-reply-publish-btn" class="topic-reply-publish-btn"
                th:if="${data.account != null}">Publish</button>
              <p id="topic-reply-status" th:if="${data.account != null}"></p>
            </div>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    let isReplyValid = false;

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        $(this).text(getFormattedDate(rawDate))
      })

      $(".backlink").attr('href', new URL('..', window.location.href).href.replace(/\/$/, ''))

      $("#register").attr('href', `/register?return=${window.location.pathname}`)
      $("#login").attr('href', `/login?return=${window.location.pathname}`)

      resizeTextarea()
      $("#topic-reply-textarea").on("input", function () {
        resizeTextarea()
      })

      $("#topic-reply-publish-btn").click(function (event) {
        replyListener(event)
      })

      // Show or hide comments
      $(".see-comment").each(function () {
        $(this).click(function () {
          const commentId = $(this).attr("data-comment-id")
          const el = $(`.comment-layout[data-comment-id="${commentId}"]`)
          el.toggleClass("hidden")
          if (el.hasClass("hidden")) {
            $(this).text("See comments")
          } else {
            $(this).text("Collapse")
          }
        })
      })

      // Enable focus and show comment textarea
      $(".comment-icon").each(function () {
        $(this).click(function () {
          const commentId = $(this).attr("data-comment-textarea-id")
          const textarea = $(`.comment-textarea[data-comment-textarea-id="${commentId}"]`)
          const commentSection = $(`.comment-layout[data-comment-id="${commentId}"]`)

          if (commentSection.hasClass("hidden")) {
            commentSection.toggleClass("hidden")
          }

          textarea.focus()
        })
      })

      $(".comment-publish-btn").click(function (event) {
        commentListener(event, $(this).attr("data-comment-id"))
      })
    })

    /**
     * Get formatted date, returning a string in format like "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      return `${year} ${monthName} ${day} ${hours}:${minutes}`
    }

    function resizeTextarea() {
      if ($("#topic-reply-textarea").length > 0) {
        $("#topic-reply-textarea").height("0px")
        $("#topic-reply-textarea").height(Math.min($("#topic-reply-textarea")[0].scrollHeight, 400) + "px")

        if ($("#topic-reply-textarea")[0].scrollHeight > 400) {
          $("#topic-reply-textarea").css("overflow-y", "auto")
        } else {
          $("#topic-reply-textarea").css("overflow-y", "hidden")
        }
      }
    }

    async function replyListener(event) {
      if (!checkReplyText()) return

      const replyText = $("#topic-reply-textarea").val();
      const payload = { reply: replyText }

      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          $("#topic-reply-textarea").val("")
          window.location.reload()
          return
        } else if (response.status == 400) {
          $("#topic-reply-status").text(await response.text())
        }

      } catch (err) {
        console.error("Reply error: ", err)
      }
    }

    function checkReplyText() {
      validateReply()
      return isReplyValid
    }

    function validateReply() {
      const replyText = $("#topic-reply-textarea").val();
      if (replyText.length < 20) {
        isReplyValid = false;
        $("#topic-reply-status").text("Your reply should contains at least 20 characters.")
      } else {
        isReplyValid = true;
        $("#topic-reply-status").text("")
      }
    }

    async function commentListener(event, commentId) {
      const commentText = $(`.comment-textarea[data-comment-textarea-id=${commentId}]`).val();
      if (!checkCommentText(commentId, commentText)) return

      const payload = { comment: commentText }

      try {
        const response = await fetch(`${window.location.href}/${commentId}`, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          $(`.comment-textarea[data-comment-textarea-id=${commentId}]`).val("")
          window.location.reload()
          return
        } else if (response.status == 400) {
          $("#comment-status").text(await response.text())
        }

      } catch (err) {
        console.error("Comment error: ", err)
      }
    }

    function checkCommentText(commentId, commentText) {
      if (commentText.length < 10) {
        $(`#comment-status[data-comment-id=${commentId}]`).text("Your comment should contains at least 10 characters.")
        return false
      } else {
        $(`#comment-status[data-comment-id=${commentId}]`).text("")
        return true
      }
    }
  </script>
</body>

</html>

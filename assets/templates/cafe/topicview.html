<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Cafe.TopicView</title>
  <style>
    .content {
      padding-left: 0;
    }

    .backlink {
      padding: 4px;
    }

    .post-header {
      display: flex;
      flex-direction: column;
    }

    .post-title {
      font-size: 16px;
      padding: 8px;
      border-top: 1px solid #ccc;
    }

    .post-row {
      display: flex;
      flex-direction: row;
      border-top: 1px solid #ccc;
    }

    .post-row:last-child {
      border-bottom: 1px solid #ccc;
    }

    .author-profile {
      width: 150px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }

    .avatar-container {
      padding: 24px;
      padding-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .avatar {
      border: 1px solid #ccc;
    }

    .author-info-container {
      font-size: 12px;
      padding-bottom: 24px;
    }

    .author-name {
      text-align: center;
      font-weight: bold;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow-wrap: anywhere;
      word-break: normal;
      overflow: hidden;
    }

    .post-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 8px;
    }

    .post-info {
      text-align: end;
      margin-top: 32px;
    }

    .post-content-container {
      flex: 1;
    }

    .reply-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
    }

    .reply-box {
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      all: unset;
    }

    .reply-textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 200px;
      max-height: 400px;
      padding-right: 12px;
      overflow-y: hidden;
      resize: none;
      cursor: text;
    }

    .reply-btn {
      width: fit-content;
      align-self: end;
    }

    #reply-status {
      color: red;
      align-self: end;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="post-header">
              <a class="link backlink" th:text="'← Back to ' + ${#strings.capitalize(data.sectionName)}"></a>
              <h1 class="post-title" th:text="${data.topic.title}"></h1>
            </div>
            <div class="posts-list">
              <div class="post-row">
                <div class="author-profile">
                  <div class="avatar-container">
                    <img class="avatar" style="padding: 4px;" src="/avatars/duck.jpg" alt="profile avatar" width="100">
                  </div>
                  <div class="author-info-container">
                    <p class="author-name" th:text="${data.topic.authorId}"></p>
                  </div>
                </div>
                <div class="post-layout">
                  <div class="post-content-container">
                    <p th:text="${data.topic.content}"></p>
                  </div>
                  <div class="post-info">
                    <span class="js-format-date" th:data-raw-date="${data.topic.postedDate}">
                  </div>
                </div>
              </div>
            </div>
            <div class="reply-section">
              <div class="reply-box">
                <textarea id="reply-textarea" class="reply-textarea" placeholder="Write your reply here..."
                  th:if="${data.account != null}"></textarea>
                <p th:if="${data.account == null}">You need to <a id="register" class="link"
                    href="/register">register</a> or <a id="login" class="link" href="/login">login</a> before posting a
                  reply.</p>
              </div>
              <button id="reply-btn" class="reply-btn" th:if="${data.account != null}">Reply</button>
              <p id="reply-status" th:if="${data.account != null}"></p>
            </div>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <script>
    let isReplyValid = false;

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        $(this).text(getFormattedDate(rawDate))
      })

      $(".backlink").attr('href', new URL('..', window.location.href).href.replace(/\/$/, ''))

      $("#register").attr('href', `/register?return=${window.location.pathname}`)
      $("#login").attr('href', `/login?return=${window.location.pathname}`)

      resizeTextarea()
      $("#reply-textarea").on("input", function () {
        resizeTextarea()
      })

      $("#reply-btn").click(function (event) {
        replyListener(event)
      })
    })

    /**
     * Get formatted date, returning a string in format like "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      return `${year} ${monthName} ${day} ${hours}:${minutes}`
    }

    function resizeTextarea() {
      if ($("#reply-textarea").length > 0) {
        $("#reply-textarea").height("0px")
        $("#reply-textarea").height(Math.min($("#reply-textarea")[0].scrollHeight, 400) + "px")

        if ($("#reply-textarea")[0].scrollHeight > 400) {
          $("#reply-textarea").css("overflow-y", "auto")
        } else {
          $("#reply-textarea").css("overflow-y", "hidden")
        }
      }
    }

    async function replyListener(event) {
      if (!checkReplyText()) return

      const replyText = $("#reply-textarea").val();
      const payload = { reply: replyText }

      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          $("#reply-textarea").val("")
          window.location.reload()
          return
        } else if (response.status == 400) {
          $("#reply-status").text(await response.text())
        }

      } catch (err) {
        console.error("Reply error: ", err)
      }
    }

    function checkReplyText() {
      validateReply()
      return isReplyValid
    }

    function validateReply() {
      const replyText = $("#reply-textarea").val();
      if (replyText.length < 20) {
        isReplyValid = false;
        $("#reply-status").text("Your reply should contains at least 20 characters.")
      } else {
        isReplyValid = true;
      }
    }
  </script>
</body>

</html>

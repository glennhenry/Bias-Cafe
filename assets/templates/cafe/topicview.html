<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Cafe.TopicView</title>
  <style>
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <h1>Cafe.TopicView</h1>
            <p th:text="${data.content}"></p>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <script>
    function formatDate(millis) {
      const date = new Date(Number(millis))
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString()
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        $(this).text(formatDate(rawDate))
      })

      $(document).on("click", ".delete-post", function (event) {
        event.preventDefault()
        const topicId = $(this).attr('data-topic-id')

        fetch("/cafe/delete", {
          method: "POST",
          body: topicId
        })
          .then(response => {
            if (response.ok) {
              location.reload();
            } else {
              console.error("Delete failed");
            }
          })
          .catch(console.error);
      })
    })
  </script>
</body>

</html>

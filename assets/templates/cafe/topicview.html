<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Cafe.TopicView</title>
  <style>
    .post-row {
      display: flex;
      flex-direction: row;
      border: 1px solid black;
    }

    .post-row+.post-row {
      border-top: none;
    }

    .author-profile {
      width: 150px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid black;
    }

    .avatar-container {
      padding: 24px;
      padding-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .avatar {
      border: 1px solid #ccc;
    }

    .author-info-container {
      font-size: 12px;
      padding-bottom: 24px;
    }

    .author-name {
      text-align: center;
      font-weight: bold;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow-wrap: anywhere;
      word-break: normal;
      overflow: hidden;
    }

    .post-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 8px;
    }

    .post-info {
      text-align: end;
    }

    .post-content-container {
      flex: 1;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <h1 th:text="${data.title}"></h1>
            <div class="post-row">
              <div class="author-profile">
                <div class="avatar-container">
                  <img class="avatar" style="padding: 4px;" src="/avatars/duck.jpg" alt="profile avatar" width="100">
                </div>
                <div class="author-info-container">
                  <p class="author-name" th:text="${data.author}"></p>
                </div>
              </div>
              <div class="post-layout">
                <div class="post-content-container">
                  <p th:text="${data.content}"></p>
                </div>
                <div class="post-info">
                  <span>Posted at</span>
                  <span class="js-format-date" th:data-raw-date="${data.postedDate}">
                  </span>
                </div>
              </div>
            </div>
            <div class="post-row">
              <div class="author-profile">
                <div class="avatar-container">
                  <img class="avatar" style="padding: 4px;" src="/avatars/duck.jpg" alt="profile avatar" width="100">
                </div>
                <div class="author-info-container">
                  <p class="author-name" th:text="${data.author}"></p>
                </div>
              </div>
              <div class="post-layout">
                <div class="post-content-container">
                  <p th:text="${data.content}"></p>
                </div>
                <div class="post-info">
                  <span>Posted at</span>
                  <span class="js-format-date" th:data-raw-date="${data.postedDate}">
                  </span>
                </div>
              </div>
            </div>
            <div class="post-row">
              <div class="author-profile">
                <div class="avatar-container">
                  <img class="avatar" style="padding: 4px;" src="/avatars/duck.jpg" alt="profile avatar" width="100">
                </div>
                <div class="author-info-container">
                  <p class="author-name" th:text="${data.author}"></p>
                </div>
              </div>
              <div class="post-layout">
                <div class="post-content-container">
                  <p th:text="${data.content}"></p>
                </div>
                <div class="post-info">
                  <span>Posted at</span>
                  <span class="js-format-date" th:data-raw-date="${data.postedDate}">
                  </span>
                </div>
              </div>
            </div>
            <!-- here -->
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <script>
    function formatDate(millis) {
      const date = new Date(Number(millis))
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString()
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        $(this).text(formatDate(rawDate))
      })
    })
  </script>
</body>

</html>

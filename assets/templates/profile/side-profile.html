<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="side-profile-styles">
  <style>
    .side-profile {
      width: 200px;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
      border-right: 1px solid #ccc;
    }

    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 4px;
      border-bottom: 1px solid #ccc;
    }

    .avatar-container p {
      font-size: 14px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border: 1px solid #ccc;
    }

    .avatar img {
      padding: 4px;
    }

    .badge-list {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid #ccc;
    }

    .badge-item {
      width: 20px;
      height: 20px;
      background-color: #ccc;
    }

    .full-width {
      width: 100%;
    }

    .profile-content {
      flex: 1;
      padding-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="side-profile" th:fragment="side-profile(avatarUrl, displayName)">
    <div class="avatar-container">
      <div class="avatar">
        <img th:src="${avatarUrl}">
      </div>
      <p><strong th:text="${displayName}"></strong></p>
    </div>
    <div class="badge-list">
      <p class="full-width">My badges</p>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
      <div class="badge-item"></div>
    </div>
  </div>

</body>

</html>

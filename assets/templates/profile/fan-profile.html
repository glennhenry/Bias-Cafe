<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Profile</title>
  <th:block th:replace="~{profile/side-profile :: side-profile-styles}"></th:block>
  <style>
    .content {
      width: 100%;
      padding: 0;
      display: flex;
    }

    ul,
    li {
      padding: 0;
      margin: 0;
    }

    .tab-view {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 4px 8px;
      border-bottom: 1px solid #ccc;
    }

    .tab-item {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #e9e9e9;
      cursor: pointer;
    }

    .tab-item:hover {
      background-color: #ccc;
    }

    .selected {
      background-color: #adadad;
    }

    .fan-profile {
      padding: 8px;
      line-height: 2;
      border-bottom: 1px solid #ccc;
    }

    .bias-container {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      width: 100%;
    }

    .bias-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .bias-item {
      width: fit-content;
      padding: 4px;
      background-color: #fbf4ff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .bio-box {
      width: 300px;
      min-height: 200px;
      color: #565656;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px;
    }

    .profile-actions {
      display: flex;
      justify-content: end;
      gap: 8px;
      margin-top: 16px;
    }

    .edit-profile-btn {
      width: max-content;
      padding: 2px 4px;
      color: #333;
      background: linear-gradient(to bottom, #f4f4f4, #dcdcdc);
      text-shadow: 0 1px #fff;
      box-shadow:
        rgba(0, 0, 0, 0.05) 0 6px 24px 0,
        rgba(0, 0, 0, 0.05) 0 0 0 1px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    .edit-profile-btn:hover {
      background-image: linear-gradient(to bottom, #f6f6f6, #e3e3e3);
      cursor: pointer;
    }

    .edit-profile-btn:active {
      background-image: linear-gradient(to top, #f4f4f4, #dcdcdc);
    }

    .user-contents {
      padding: 8px
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div
              th:replace="~{profile/side-profile :: side-profile(avatarUrl='/avatars/duck.jpg', displayName='Yujin Fan 😊 582')}">
            </div>
            <div class="profile-content">
              <ul class="tab-view">
                <li class="tab-item"><a href="overview">Overview</a></li>
                <li class="tab-item selected"><a href="#">Fan Profile</a></li>
              </ul>
              <div class="fan-profile">
                <p><strong>Started stan:</strong> 19 August 2026</p>
                <p><strong>Favorite song:</strong> WA DA DA</p>
                <p><strong>Favorite era:</strong> First Impact</p>
                <div class="bias-container">
                  <p class="full-width"><strong>My bias</strong></p>
                  <div class="bias-list">
                    <div class="bias-item" data-member-name="Chaehyun">
                      <p>Chaehyun</p>
                    </div>
                    <div class="bias-item" data-member-name="Dayeon">
                      <p>Dayeon</p>
                    </div>
                    <div class="bias-item" data-member-name="Hikaru">
                      <p>Hikaru</p>
                    </div>
                    <div class="bias-item" data-member-name="Hiyyih">
                      <p>Hiyyih</p>
                    </div>
                    <div class="bias-item" data-member-name="Mashiro">
                      <p>Mashiro</p>
                    </div>
                    <div class="bias-item" data-member-name="Xiaoting">
                      <p>Xiaoting</p>
                    </div>
                    <div class="bias-item" data-member-name="Yeseo">
                      <p>Yeseo</p>
                    </div>
                    <div class="bias-item" data-member-name="Youngeun">
                      <p>Youngeun</p>
                    </div>
                    <div class="bias-item" data-member-name="Yujin">
                      <p>Yujin</p>
                    </div>
                  </div>
                </div>
                <p><strong>About Kep1er:</strong></p>
                <div class="bio-box">
                  <p>Write your story about Kep1er!</p>
                </div>
                <div class="profile-actions">
                  <a class="edit-profile-btn" href="javascript:void(0)">
                    <p>Edit profile</p>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
</body>

</html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Profile</title>
  <th:block th:replace="~{profile/side-profile :: side-profile-styles}"></th:block>
  <style>
    .content {
      width: 100%;
      padding: 0;
      display: flex;
    }

    .tab-view {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 4px 8px;
      border-bottom: 1px solid #ccc;
    }

    .tab-item {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #e9e9e9;
      cursor: pointer;
    }

    .tab-item:hover {
      background-color: #ccc;
    }

    .selected {
      background-color: #adadad;
    }

    .profile-overview {
      padding: 8px;
      line-height: 2;
      border-bottom: 1px solid #ccc;
    }

    .bio-box {
      width: 300px;
      min-height: 200px;
      color: #565656;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px;
    }

    .profile-actions {
      display: flex;
      justify-content: end;
      gap: 8px;
      margin-top: 16px;
    }

    .edit-profile-btn {
      width: max-content;
      padding: 2px 4px;
      color: #333;
      background: linear-gradient(to bottom, #f4f4f4, #dcdcdc);
      text-shadow: 0 1px #fff;
      box-shadow:
        rgba(0, 0, 0, 0.05) 0 6px 24px 0,
        rgba(0, 0, 0, 0.05) 0 0 0 1px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    .edit-profile-btn:hover {
      background-image: linear-gradient(to bottom, #f6f6f6, #e3e3e3);
      cursor: pointer;
    }

    .edit-profile-btn:active {
      background-image: linear-gradient(to top, #f4f4f4, #dcdcdc);
    }

    .user-contents {
      padding: 8px
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div
              th:replace="~{profile/side-profile :: side-profile(avatarUrl='/avatars/duck.jpg', displayName='Yujin Fan 😊 582')}">
            </div>
            <div class="profile-content">
              <ul class="tab-view">
                <li class="tab-item selected"><a href="#">Overview</a></li>
                <li class="tab-item"><a href="fan-profile">Fan Profile</a></li>
              </ul>
              <div class="profile-overview">
                <p><strong>Username</strong>: yujin_582</p>
                <p><strong>Display name</strong>: Yujin Fan 😊 582</p>
                <p><strong>Country</strong>: Indonesia</p>
                <p><strong>Birthday</strong>: 16 August 2026</p>
                <p><strong>Bio</strong>:
                <div class="bio-box">
                  <p>This user is too lazy to write anything here</p>
                </div>
                <div class="profile-actions">
                  <a class="edit-profile-btn" href="javascript:void(0)">
                    <p>Edit profile</p>
                  </a>
                </div>
              </div>
              <div class="user-contents">
                <p>Guestbook</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
</body>

</html>
